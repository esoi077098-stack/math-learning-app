<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Math Quest</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">Learning app</p>
          <h1>Math Quest</h1>
        </div>
        <button id="resetBtn" class="secondary-btn">Reset progress</button>
      </header>

      <main class="dashboard">
        <section class="panel stats-panel">
          <div class="stat-card accent">
            <span>Score</span>
            <strong id="scoreValue">0</strong>
          </div>
          <div class="stat-card">
            <span>Streak</span>
            <strong id="streakValue">0</strong>
          </div>
          <div class="stat-card">
            <span>Correct</span>
            <strong id="correctValue">0</strong>
          </div>
          <div class="stat-card">
            <span>Level</span>
            <strong id="levelValue">1</strong>
          </div>
        </section>

        <section class="panel lesson-panel">
          <div class="label-row">
            <span class="pill">Practice</span>
            <span id="topicBadge" class="pill soft">Addition</span>
          </div>

          <div class="question-box">
            <div class="prompt-label">Solve:</div>
            <div id="questionText" class="question-text">2 + 2</div>
          </div>

          <form id="answerForm" class="answer-form">
            <label for="answerInput">Your answer</label>
            <input
              id="answerInput"
              type="number"
              inputmode="numeric"
              autocomplete="off"
              placeholder="Type here"
              required
            />
            <div class="controls">
              <button type="submit" class="primary-btn">Check answer</button>
              <button type="button" id="skipBtn" class="ghost-btn">Skip</button>
            </div>
          </form>

          <div id="feedback" class="feedback" aria-live="polite">
            Choose a topic and start learning.
          </div>
        </section>

        <aside class="panel side-panel">
          <h2>Choose a topic</h2>
          <div class="topic-grid">
            <button class="topic-btn active" data-topic="addition">Addition</button>
            <button class="topic-btn" data-topic="subtraction">Subtraction</button>
            <button class="topic-btn" data-topic="multiplication">Multiplication</button>
            <button class="topic-btn" data-topic="division">Division</button>
          </div>

          <div class="difficulty-box">
            <h3>Difficulty</h3>
            <div class="difficulty-options">
              <button class="difficulty-btn active" data-difficulty="easy">Easy</button>
              <button class="difficulty-btn" data-difficulty="medium">Medium</button>
              <button class="difficulty-btn" data-difficulty="hard">Hard</button>
            </div>
          </div>
        </aside>
      </main>

      <section class="panel learning-panel">
        <div class="learning-header">
          <h2>Quick learning tips</h2>
        </div>
        <div id="tipsBox" class="tips-box"></div>
      </section>
    </div>

    <script src="app.js"></script>
  </body>
</html>
